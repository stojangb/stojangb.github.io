  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }

    /* Keyframes para la rotación del cubo */
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* El cubo de Metatrón gira siempre lentamente (20s/vuelta)
       y, al hacer hover, gira más rápido (5s/vuelta) en sentido inverso */
    #metatron-cube {
      animation: rotate 20s linear infinite;
    }
    #metatron-cube:hover {
      animation: rotate 5s linear infinite reverse;
    }

    /* Estilo para cada círculo del cubo, con efecto glow celestial */
    .circle {
      position: absolute;
      width: 3rem;
      height: 3rem;
      border: 2px solid rgba(165,180,252,0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(165,180,252,0.2) 0%, transparent 70%);
      box-shadow: 0 0 8px rgba(165,180,252,0.8);
    }

    /* Estilos para la animación en Technology Skills (sección Especialización) */
    #tech-animation svg {
      width: 100%;
      height: 100%;
    }
    #tech-animation {
      overflow: hidden;
    }

    /* Tooltip for technology descriptions */
    #tech-tooltip {
      position: absolute;
      background: #000;
      color: #00ff00;
      padding: 0.5rem 0.75rem;
      border-radius: 0.25rem;
      font-family: monospace;
      font-size: 0.875rem;
      pointer-events: none;
      white-space: normal;
      max-width: 90vw;
      z-index: 1000;
      display: none;
    }

    /* Animaciones para los recuadros de herramientas */
    @keyframes spinGrow {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.2) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }
    .spin-grow {
      animation: spinGrow 0.3s ease-in-out;
    }

    /* Animación para el texto del footer */
    @keyframes footerZoom {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-30px) scale(2); opacity: 0; }
    }
    .footer-zoom {
      animation: footerZoom 0.8s ease-in-out forwards;
      position: absolute;
      z-index: 1000;
      pointer-events: none;
      color: white;
    }
  </style>

    // Tooltip logic for technology descriptions
    let tooltipInterval;
    let lastEvent;

    function positionTooltip(tooltip, evt) {
      const padding = 15;
      let x = evt.pageX + padding;
      let y = evt.pageY + padding;
      const width = tooltip.offsetWidth;
      const height = tooltip.offsetHeight;
      const maxX = window.innerWidth - width - padding;
      const maxY = window.innerHeight - height - padding;
      if (x > maxX) x = maxX;
      if (y > maxY) y = maxY;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    }

    function showTechTooltip(text, evt) {
      const tooltip = document.getElementById('tech-tooltip');
      tooltip.style.display = 'block';
      tooltip.textContent = '';
      lastEvent = evt;
      clearInterval(tooltipInterval);
      let index = 0;
      tooltipInterval = setInterval(() => {
        if (index < text.length) {
          tooltip.textContent += text.charAt(index);
          index++;
          positionTooltip(tooltip, lastEvent);
        } else {
          clearInterval(tooltipInterval);
        }
      }, 40);
      positionTooltip(tooltip, evt);
    }

    function moveTechTooltip(evt) {
      lastEvent = evt;
      const tooltip = document.getElementById('tech-tooltip');
      positionTooltip(tooltip, evt);
    }

    function hideTechTooltip() {
      const tooltip = document.getElementById('tech-tooltip');
      tooltip.style.display = 'none';
      clearInterval(tooltipInterval);
    }

    /* Animación para Technology Skills ya implementada previamente */
    function initTechAnimation() {
      const container = document.getElementById('tech-animation');
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute("viewBox", "0 0 400 300");
      svg.style.width = "100%";
      svg.style.height = "100%";
      container.appendChild(svg);
      function clearSVG() {
        while (svg.firstChild) {
          svg.removeChild(svg.firstChild);
        }
      }
      function createDot(cx, cy, r = 5) {
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute("cx", cx);
        circle.setAttribute("cy", cy);
        circle.setAttribute("r", r);
        circle.setAttribute("fill", "#a5b4fc");
        circle.style.opacity = 0;
        circle.style.transition = "opacity 1s ease-in-out";
        setTimeout(() => { circle.style.opacity = 1; }, 10);
        svg.appendChild(circle);
        return circle;
      }
      function createLine(x1, y1, x2, y2) {
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("stroke", "#a5b4fc");
        line.setAttribute("stroke-width", "1");
        line.style.opacity = 0;
        line.style.transition = "opacity 1s ease-in-out";
        svg.appendChild(line);
        setTimeout(() => { line.style.opacity = 1; }, 10);
        return line;
      }
      let dots = [];
      function animateNetwork() {
        clearSVG();
        dots = [];
        const initial = [
          { cx: 100, cy: 150 },
          { cx: 200, cy: 50 },
          { cx: 300, cy: 150 }
        ];
        initial.forEach(pos => {
          const dot = createDot(pos.cx, pos.cy);
          dots.push({ pos, element: dot });
        });
        createLine(initial[0].cx, initial[0].cy, initial[1].cx, initial[1].cy);
        createLine(initial[1].cx, initial[1].cy, initial[2].cx, initial[2].cy);
        createLine(initial[2].cx, initial[2].cy, initial[0].cx, initial[0].cy);
        const additional = 4;
        const delay = 2000;
        for (let i = 0; i < additional; i++) {
          setTimeout(() => {
            const cx = 50 + Math.random() * 300;
            const cy = 50 + Math.random() * 200;
            const newDot = createDot(cx, cy);
            dots.push({ pos: { cx, cy }, element: newDot });
            for (let j = 0; j < dots.length - 1; j++) {
              createLine(dots[j].pos.cx, dots[j].pos.cy, cx, cy);
            }
          }, delay * (i + 1));
        }
        setTimeout(() => {
          svg.querySelectorAll("line").forEach(line => { line.style.opacity = 0; });
          svg.querySelectorAll("circle").forEach(circle => { circle.style.opacity = 0; });
        }, delay * (additional + 1));
        setTimeout(() => { animateNetwork(); }, delay * (additional + 3));
      }
      animateNetwork();
    }

    /* Animaciones secuenciales para herramientas adicionales */
    let toolAnimating = false;
    function startToolSequence(start) {
      if (toolAnimating) return;
      const items = document.querySelectorAll('#tools-extra > div');
      if (start < 0 || start >= items.length) return;
      toolAnimating = true;

      function animateNext(i) {
        if (i >= items.length) {
          animateFooter();
          return;
        }
        const el = items[i];
        el.classList.add('spin-grow');
        el.addEventListener('animationend', function handler() {
          el.classList.remove('spin-grow');
          el.removeEventListener('animationend', handler);
          animateNext(i + 1);
        });
      }

      animateNext(start);
    }

    function animateFooter() {
      const footer = document.getElementById('footer-text');
      if (!footer) { toolAnimating = false; return; }
      footer.scrollIntoView({behavior: 'smooth', block: 'center'});
      setTimeout(() => {
        const clone = footer.cloneNode(true);
        const rect = footer.getBoundingClientRect();
        clone.style.position = 'fixed';
        clone.style.left = rect.left + 'px';
        clone.style.top = rect.top + 'px';
        clone.style.width = rect.width + 'px';
        clone.classList.add('footer-zoom');
        document.body.appendChild(clone);
        clone.addEventListener('animationend', () => {
          clone.remove();
          toolAnimating = false;
        });
      }, 400);
    }
