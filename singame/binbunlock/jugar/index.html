<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binbunlock</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0b10;
      }
      #unity-container {
        position: fixed;
        inset: 0;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0b0b10;
        touch-action: none;
        outline: none;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(420px, 76vw);
        text-align: center;
      }
      #unity-logo {
        font: 700 44px/1.1 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f2c14e;
        letter-spacing: 3px;
        margin-bottom: 22px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, .8);
      }
      #unity-progress-bar-empty {
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, .16);
        overflow: hidden;
      }
      #unity-progress-bar-full {
        height: 100%;
        width: 0%;
        background: #6cc04a;
        transition: width .15s linear;
      }
      #unity-warning {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 8px;
        display: none;
        background: #fff;
        z-index: 10;
      }
      #unity-warning div {
        padding: 6px 8px;
        font: 14px system-ui, sans-serif;
        color: #111;
      }
      #unity-footer {
        position: absolute;
        right: 6px;
        top: 6px;
        display: flex;
        gap: 12px;
        align-items: center;
        font: 13px system-ui, sans-serif;
        color: #b9b9c2;
        opacity: .45;
        user-select: none;
      }
      #unity-footer:hover {
        opacity: .9;
      }
      #unity-fullscreen-button {
        width: 22px;
        height: 22px;
        line-height: 22px;
        text-align: center;
        font-size: 18px;
        cursor: pointer;
        border-radius: 3px;
      }
      #unity-fullscreen-button:hover {
        background: rgba(255, 255, 255, .14);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo">Binbunlock</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button" title="Fullscreen">&#9974;</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var unityInstance = null;

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style.background = "red";
        else if (type == "warning") div.style.background = "yellow";
        if (type != "error") {
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/game-webgl.loader.js";
      var config = {
        dataUrl: buildUrl + "/game-webgl.data.unityweb",
        frameworkUrl: buildUrl + "/game-webgl.framework.js.unityweb",
        codeUrl: buildUrl + "/game-webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Singame",
        productName: "Binbunlock",
        productVersion: "0.0.37",
        // El guardado en IndexedDB se sincroniza solo al escribir (sin el
        // aviso de deprecacion de JS_FileSystem_Sync).
        autoSyncPersistentDataPath: true,
        showBanner: unityShowBanner
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = 100 * progress + "%";
        }).then(function (instance) {
          unityInstance = instance;
          loadingBar.style.display = "none";
          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
