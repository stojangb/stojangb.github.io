<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contáctanos para colaborar en nuevas infografías" />
  <title data-es="Contacto - Timegrafia">Contact - Timegrafia</title>
  <script src="extras/tailwind.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <header class="flex justify-between items-center p-4 bg-white shadow">
    <h1 class="text-2xl font-bold"><a href="index.html">Timegrafia</a></h1>
    <nav class="space-x-4 flex items-center">
      <a href="index.html" class="px-2 py-1 bg-purple-600 text-white rounded" data-es="Inicio">Home</a>
      <a href="about.html" data-es="Nosotros">About</a>
      <a href="pricing.html" data-es="Precios">Pricing</a>
      <a href="contact.html" data-es="Contacto">Contact</a>
      <button id="lang-toggle" data-lang="es" class="px-2 py-1 bg-gray-800 text-white rounded text-sm">EN</button>
    </nav>
  </header>
  <main class="flex-grow max-w-3xl mx-auto p-4 space-y-4">
    <h2 class="text-xl font-semibold" data-es="Contacto">Get in Touch</h2>
    <div class="space-y-3">
      <div class="flex items-center gap-3"><span>📧</span><span>stojangasic@gmail.com</span></div>
      <div class="flex items-center gap-3"><span>📞</span><span>+353 87 239 9392</span></div>
      <div class="flex items-center gap-3"><span>🔗</span><a class="underline" href="https://www.linkedin.com/in/stojan-gasic-brieva" target="_blank">linkedin.com/in/stojan-gasic-brieva</a></div>
      <div class="flex items-center gap-3"><span>🐱</span><a class="underline" href="https://github.com/stojangb" target="_blank">github.com/stojangb</a></div>
    </div>
  </main>
  <footer class="text-center py-4 text-gray-500 text-xs">© 2026 Timegrafia</footer>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("[data-es]").forEach(el => { el.dataset.en = el.innerHTML; });
      const toggle = document.getElementById("lang-toggle");
      function applyLang(lang) {
        toggle.dataset.lang = lang;
        toggle.textContent = lang === "es" ? "EN" : "ES";
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-es]").forEach(el => { el.innerHTML = el.dataset[lang]; });
      }
      if (toggle) {
        applyLang("es");
        toggle.addEventListener("click", () => {
          applyLang(toggle.dataset.lang === "es" ? "en" : "es");
        });
      }
    });
  </script>
</body>
</html>
